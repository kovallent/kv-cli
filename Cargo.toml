[package]
name = "kv-cli"
version = "0.14.1"
edition = "2021"
description = "Kovallent parameter-contract linter for Python codebases"
license = "MIT"

[[bin]]
name = "kv-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
tree-sitter = "0.26.12"
tree-sitter-python = "0.25.0"
sha2 = "0.11.0"
schemars = "1.2.2"
# Pinned to one minor version (owner decision 2 in docs/design/sql-models.md):
# patch releases arrive, a minor upgrade is deliberate. Without the default
# `recursive-protection`, so no extra crates: the parser's own recursion
# limit turns deeply nested SQL into a parse error, reported as sql_not_parsed.
sqlparser = { version = "0.64", default-features = false, features = ["std", "visitor"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
jsonschema = { version = "0.49.9", default-features = false }
