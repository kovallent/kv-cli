[package]
name = "kv-cli"
version = "0.3.0"
edition = "2021"
description = "Kovallent parameter-contract linter for Python codebases"
license = "MIT"

[[bin]]
name = "kv-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
tree-sitter = "0.26.12"
tree-sitter-python = "0.25.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
