name: CI

# Every pull request and every push to main runs the same gate as
# `make check`: formatting, clippy with warnings as errors, and the full test
# suite - unit, end-to-end against the compiled binary, and the labelled
# corpus. Tests run on each platform the release workflow ships for.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The release workflow writes the Homebrew formula with this script;
      # a broken one would only show up at release time otherwise.
      - name: Homebrew formula
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            printf '%064d  kv-cli-%s.tar.gz\n' 0 "$t"
          done > SHA256SUMS
          packaging/homebrew/formula.sh 0.0.0 SHA256SUMS > kv-cli.rb
          ruby -c kv-cli.rb

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform, rather than cancelling the rest on the first
      # failure: a Windows-only failure is exactly what this job is for.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # tree-sitter's grammar is C; caching saves recompiling it every run.
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --all-targets

      # The tests already gate on the corpus; this prints its precision and
      # recall table in the log for anyone reviewing a detection change.
      - name: Corpus report
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --test corpus -- --nocapture
