name: Release kv-cli Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Graviton / ARM CI runners, and a prerequisite for ARM Linux
          # wheels or Homebrew on ARM Linux later.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
          # macos-13 was GitHub's last Intel image and is retired. All
          # current macOS runners are arm64, so Intel is cross-compiled —
          # both Apple targets ship in the same Xcode toolchain.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # tree-sitter's grammar is C, so a cross build needs a cross cc,
      # not just the Rust target.
      - name: Install cross linker (Linux aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary
        shell: bash
        run: |
          mkdir -p dist
          bin=kv-cli
          if [ "${{ runner.os }}" = "Windows" ]; then bin=kv-cli.exe; fi
          tar -czf "dist/kv-cli-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "$bin"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kv-cli-${{ matrix.target }}
          path: dist/*.tar.gz

  # One release job instead of five racing to create the same release —
  # and the only place SHA256SUMS can be computed over the full set.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kv-cli-*
          merge-multiple: true
          path: dist

      - name: Generate Checksums
        run: cd dist && sha256sum *.tar.gz | tee SHA256SUMS

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # `brew install kovallent/tap/kv-cli` installs what this job writes. It
  # runs after the release is public, so the formula never points at an
  # archive that does not exist yet. A prerelease tag (v0.7.0-rc.1) is not
  # what `brew upgrade` should install, so it is skipped.
  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the tap token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set, so brew users stay on the previous release. See docs/development.md."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout the tap
        uses: actions/checkout@v4
        with:
          repository: kovallent/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl -sSfL -o SHA256SUMS \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/SHA256SUMS"
          mkdir -p tap/Formula
          packaging/homebrew/formula.sh "$version" SHA256SUMS > tap/Formula/kv-cli.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kv-cli.rb
          if git diff --cached --quiet; then
            echo "formula already at $version"
          else
            git commit -m "kv-cli $version"
            git push
          fi
