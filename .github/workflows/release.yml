name: Release kv-cli Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: kv-cli-linux-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: kv-cli-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: kv-cli-macos-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: kv-cli-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename & Package Binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv kv-cli.exe ${{ matrix.artifact_name }}
          else
            mv kv-cli ${{ matrix.artifact_name }}
          fi

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
