- id: kv-cli
  name: kv-cli contract audit
  description: Audit Python pipelines, notebooks and config files for contract breaches, hardcoded secrets, and pinned infrastructure.
  entry: kv-cli audit
  language: rust
  # Mirrors the default `scan.include`. A `files` pattern rather than
  # `types_or`: pre-commit tags a generic `.cfg` (e.g. airflow.cfg) only as
  # `text`, so no list of types can select it.
  types: [text]
  files: '(\.(py|ipynb|ya?ml|toml|ini|cfg|json|env)|(^|/)\.env(\.[^/]*)?)$'

- id: kv-cli-contract
  name: kv-cli contract check
  description: Validate .kovallent.yaml when it changes - every problem with its line, without scanning code.
  entry: kv-cli contract check
  language: rust
  # Only the contract itself; each changed one is passed by name, so a
  # contract in a subfolder is checked too.
  files: '(^|/)\.kovallent\.yaml$'
