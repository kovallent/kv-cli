" font-weight="700">c7b4c1dd8fd9e840</tspan></text><text class="l12" xml:space="preserve" opacity="1"><tspan x="36.0" y="362" fill="#8A96A8">  · functions: 10 in scope, 0 framework-exempt, 2 user-exempt, 1 out of scope</tspan></text><text class="l14" xml:space="preserve" opacity="1"><tspan x="36.0" y="410" fill="#F1F5F9" text-decoration="underline">deploy.py</tspan></text><text class="l15" xml:space="preserve" opacity="1"><tspan x="36.0" y="434" fill="#8A96A8">    11  </tspan><tspan x="100.8" y="434" fill="#E11D48" font-weight="700">error</tspan><tspan x="141.3" y="434" fill="#8A96A8">  KV002  </tspan><tspan x="214.2" y="434" fill="#F1F5F9" font-weight="700">`DB_PASSWORD`</tspan><tspan x="319.5" y="434" fill="#F1F5F9"> is assigned a hardcoded literal</tspan></text><text class="l16" xml:space="preserve" opacity="1"><tspan x="36.0" y="458" fill="#8A96A8">        value &#34;s3…&#34; (&lt;redacted&gt;, 20 chars) — load it from the environment</tspan></text><text class="l17" xml:space="preserve" opacity="1"><tspan x="36.0" y="482" fill="#8A96A8">    20  </tspan><tspan x="100.8" y="482" fill="#E11D48" font-weight="700">error</tspan><tspan x="141.3" y="482" fill="#8A96A8">  KV001  </tspan><tspan x="214.2" y="482" fill="#F1F5F9" font-weight="700">`deploy_service`</tspan><tspan x="343.8" y="482" fill="#F1F5F9"> is missing contract parameter </tspan><tspan x="594.9" y="482" fill="#F1F5F9" font-weight="700">`target_environment`</tspan></text><text class="l18" xml:space="preserve" opacity="1"><tspan x="36.0" y="506" fill="#8A96A8">        expected signature to declare `target_environment: str = &#34;dev&#34;`</tspan></text><text class="l20" xml:space="preserve" opacity="1"><tspan x="36.0" y="554" fill="#E11D48" font-weight="700">FAIL</tspan><tspan x="68.4" y="554" fill="#F1F5F9"> 13 errors, 6 warnings </tspan><tspan x="254.7" y="554" fill="#8A96A8">(19 gating under --strict)</tspan></text><text xml:space="preserve" x="36" y="602" fill="#00F2FE" font-weight="700">$</text><text x