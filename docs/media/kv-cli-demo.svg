<svg xmlns="http://www.w3.org/2000/svg" width="800" height="730" viewBox="0 0 800 730" role="img" aria-label="kv-cli audit --strict on deploy.py reports DB_PASSWORD assigned a hardcoded literal at line 11 (KV002, value redacted) and deploy_service missing the contract parameter target_environment at line 20 (KV001), failing with 13 errors and 6 warnings. kv-cli fix adds target_environment to deploy_service, rewrites DB_PASSWORD to read os.environ DB_PASSWORD, flags a hardcoded default on line 90 for manual review, and applies 18 changes across 1 file. After that one line is threaded by hand, audit --strict reports PASS, 2 files are compliant." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
