description: >
  Gate every pull request on kv-cli's exit code. Set KOVALLENT_CONTRACT_SHA
  to your contract's fingerprint as a project environment variable, which
  pull-request authors cannot edit, and make the job a required status check.

usage:
  version: 2.1
  orbs:
    kv-cli: kovallent/kv-cli@0.15.0
  workflows:
    kovallent:
      jobs:
        - kv-cli/audit:
            name: Kovallent gate
            expect-contract: KOVALLENT_CONTRACT_SHA
